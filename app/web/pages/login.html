<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台登录 · Matrix One</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/common.js" defer></script>
  <script src="/assets/login.js" defer></script>
</head>
<body>
  <main class="auth-layout">
    <section class="auth-aside">
      <a class="brand" href="/"><img src="/assets/logo.svg" alt=""><span class="brand-copy"><span class="brand-name">Matrix One</span><span class="brand-sub">中国供应网络</span></span></a>
      <div class="auth-copy">
        <h1>让每一份真实供货能力，都能被全球需求调用。</h1>
        <p>在一个工作台中维护商品、报价、MOQ、库存和交期，并持续积累可验证的供应商履约数据。</p>
        <div class="auth-points"><div class="auth-point">统一商品与供应商 SKU</div><div class="auth-point">价格和库存持续更新</div><div class="auth-point">多种全球分发合作</div><div class="auth-point">关键操作事件审计</div></div>
      </div>
    </section>
    <section class="auth-main">
      <div class="auth-box">
        <h2>登录 Matrix One 工作台</h2>
        <p>供应商进入供给工作台，平台团队进入审核管理端。</p>
        <div class="demo-callout"><strong>本地开发演示账号</strong><span>供应商：supplier@matrix-one.tech / MatrixOne123!</span><span>平台管理员：admin@matrix-one.tech / MatrixAdmin123!</span></div>
        <form id="login-form" class="stack" novalidate>
          <label class="form-group"><span class="form-label">登录邮箱</span><input class="input" type="email" name="email" value="supplier@matrix-one.tech" autocomplete="username" required></label>
          <label class="form-group"><span class="form-label">密码</span><input class="input" type="password" name="password" value="MatrixOne123!" autocomplete="current-password" minlength="8" required></label>
          <p id="login-message" class="form-message" aria-live="polite"></p>
          <button id="login-submit" class="btn btn-primary btn-lg" type="submit">登录工作台</button>
        </form>
        <div class="auth-links"><a href="/">返回首页</a><a href="/apply">尚未入驻？提交申请</a></div>
      </div>
    </section>
  </main>
</body>
</html>
